org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
# Gradle must run on a JDK this project's AGP/Kotlin versions support (<= 21).
# If your JAVA_HOME is newer -- Android Studio's bundled JBR is 25 -- set
# `org.gradle.java.home` in your own ~/.gradle/gradle.properties, never here:
# it is read before the daemon starts, so no build script can set it, and an
# absolute path in a tracked file breaks every other checkout and CI.
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false

# Fix for geolocator and other plugin compatibility issues
android.compileSdkVersion=34
android.targetSdkVersion=34
android.minSdkVersion=21
flutter.compileSdkVersion=34
flutter.targetSdkVersion=34
flutter.minSdkVersion=21
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
